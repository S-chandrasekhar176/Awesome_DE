      ORB: 1.3
      PTC: 1.2
      SIC: 1.1
      MB: 1.0
      VC: 1.0
      MRF: 0.8
      TRS: 0.0
  Bear:
    active:
    - ORB
    - PTC
    - VC
    - SIC
    - MB
    - MRF
    paused:
    - TRS
    weights:
      ORB: 1.2
      PTC: 1.1
      SIC: 1.0
      MB: 1.0
      VC: 0.9
      MRF: 0.7
